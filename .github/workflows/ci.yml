name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────────
  # Même Node et même gestionnaire (npm + package-lock.json) que Railway : la CI teste
  # exactement les versions déployées (backend/.nvmrc = source unique de la version Node).
  backend:
    name: Backend — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Bloque une vulnérabilité connue (high/critical) dans les dépendances de production.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      # Quality Gate : le seuil ≥80% (statements/lines/functions) est appliqué
      # nativement par Vitest (coverage.thresholds dans vitest.config.ts).
      # Cette step échoue automatiquement si la couverture passe sous 80%.
      - name: Unit tests + coverage (Quality Gate ≥ 80%)
        run: npm run test:coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || 'placeholder' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder' }}
          NODE_ENV: test

      - name: Build
        run: npm run build

  # ─── Plugin ───────────────────────────────────────────────────────────────────
  plugin:
    name: Plugin — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: backend/.nvmrc
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build plugin
        run: npm run build
